# Release: build, test, pack the `pinion` dotnet tool, and (on a version tag) publish it to NuGet.
# This is how updates reach users — they run `dotnet tool update -g Pinion` to pull a published version.
#
# To cut a release:   git tag v0.2.0 && git push origin v0.2.0
#   → packs Pinion 0.2.0 and publishes it to NuGet via Trusted Publishing (OIDC — no stored API key).
# A manual run (workflow_dispatch) builds, tests and packs, uploads the .nupkg as an artifact, and
# NEVER publishes — the publish step requires a v* tag. Use it to rehearse a release safely.
#
# Publishing uses nuget.org Trusted Publishing: GitHub mints a short-lived OIDC token, nuget.org
# validates it against the policy registered for this repo + this workflow file, and returns a
# temporary API key valid for 1 hour. Nothing long-lived is stored anywhere.
# Policy: nuget.org → your username → Trusted Publishing → owner AGomnes, repo Pinion,
# workflow file `release.yml`, environment blank. Docs: https://aka.ms/nuget/trusted-publishing
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}   # manual run: pack + artifact only, never publishes

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read     # actions/checkout
      id-token: write    # REQUIRED: lets GitHub issue the OIDC token. Without it the token
                         # request fails silently and NuGet/login gets no key.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build (Release)
        run: dotnet build Pinion.slnx -c Release

      - name: Test
        run: dotnet test tests/Pinion.Tests/Pinion.Tests.csproj -c Release --no-build --filter "Category!=EndToEnd"

      # The end-to-end tier actually synthesizes, builds, runs and snapshots a generated test. It is
      # the guard that catches "the shipped tool doesn't really work", so a release must not skip it.
      - name: Test (end-to-end generate pipeline)
        run: dotnet test tests/Pinion.Tests/Pinion.Tests.csproj -c Release --no-build --filter "Category=EndToEnd"

      - name: Pack
        # On a tag, the package version comes from the tag (v0.2.0 -> 0.2.0); otherwise a -ci suffix.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-ci"; fi
          echo "Packing version $VER"
          dotnet pack src/Pinion.Cli/Pinion.Cli.csproj -c Release -o artifacts -p:Version="$VER"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # Requested immediately before the push: the temporary key expires after 1 hour, and each
      # OIDC token can be exchanged exactly once.
      - name: NuGet login (OIDC -> temporary API key)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org PROFILE NAME, not an email address

      - name: Publish to NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
