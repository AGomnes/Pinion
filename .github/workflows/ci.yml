# Pinion's own CI — build the multi-targeted solution and run the test suite on every push/PR.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build (Release, all projects)
        run: dotnet build Pinion.slnx -c Release

      # Fast suite: source-level + analysis tests (excludes the slow end-to-end tier below).
      - name: Test
        run: dotnet test tests/Pinion.Tests/Pinion.Tests.csproj -c Release --no-build --filter "Category!=EndToEnd"

      # End-to-end guard: actually synthesizes, builds, runs, and snapshots a generated test against
      # the LegacyShop sample (spawns its own `dotnet test`, so it's slower — kept as a separate step).
      - name: Test (end-to-end generate pipeline)
        run: dotnet test tests/Pinion.Tests/Pinion.Tests.csproj -c Release --no-build --filter "Category=EndToEnd"
